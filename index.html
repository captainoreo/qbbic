<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qbbic - System Warning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/Icon (1).svg" type="image/gif" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- GLOBAL & RESET --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19; /* Deep, dark modern background */
            font-family: 'Inter', Arial, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* --- 1. MODERN WARNING SCREEN (Top Layer) --- */
        #safety-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease-in-out;
            backdrop-filter: blur(8px);
        }

        #safety-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .warning-card {
            background-color: #111827;
            border: 1px solid #374151;
            border-top: 4px solid #ef4444; /* Stark red warning line */
            border-radius: 8px;
            padding: 50px 40px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-wrapper {
            background-color: rgba(239, 68, 68, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            color: #ef4444;
        }

        .safety-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f3f4f6;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .safety-text {
            font-size: 16px;
            line-height: 1.7;
            color: #9ca3af;
            margin-bottom: 40px;
        }

        .safety-text strong {
            color: #d1d5db;
        }

        .btn-continue {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3);
        }

        .btn-continue:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(239, 68, 68, 0.4);
        }

        .btn-continue:active {
            transform: translateY(1px);
        }

        /* --- 2. MODERN LOADING SCREEN (Bottom Layer) --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            z-index: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

    </style>
</head>
<body>

    <audio id="select-sound" src="/assets/Options.wav" preload="auto"></audio>

    <div id="safety-screen">
        <div class="warning-card">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-10 h-10" style="width: 40px; height: 40px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <div class="safety-title">Work & School Safety Warning</div>
            <div class="safety-text">
                <p style="margin-bottom: 15px;">Before proceeding, please ensure you have fully completed all assigned classwork and job responsibilities.</p>
                <p>If you are caught neglecting your duties to access this site, <strong>Team Qbbic claims no responsibility.</strong></p>
            </div>
            <button id="btn-acknowledge" class="btn-continue">I Understand & Continue</button>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Initializing Qbbic System</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const safetyScreen = document.getElementById('safety-screen');
            const ackButton = document.getElementById('btn-acknowledge');
            const selectSound = document.getElementById('select-sound');
            
            function enterSite() {
                // Prevent double clicking
                if(safetyScreen.getAttribute('data-clicked') === 'true') return;
                safetyScreen.setAttribute('data-clicked', 'true');
                
                // 1. Play Sound
                if(selectSound) {
                    selectSound.currentTime = 0;
                    selectSound.play().catch(e => console.log('Audio autoplay blocked'));
                }
                
                // 2. Fade out Safety Screen
                safetyScreen.classList.add('fade-out');

                // 3. Wait a moment for the fade to finish, then redirect
                setTimeout(() => {
                    window.location.href = 'games.html';
                }, 2000); // Shortened the wait time slightly to match the faster, modern feel
            }

            // Listen for button click
            ackButton.addEventListener('click', enterSite);
            
            // Listen for Enter key as a quick shortcut
            document.addEventListener('keydown', (e) => {
                if (document.body.contains(safetyScreen) && e.key === 'Enter') {
                    enterSite();
                }
            });
        });
    </script>
</body>
</html>
