<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qbbic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/Icon (1).svg" type="image/gif" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Architects+Daughter&family=Press+Start+2P&family=Anton&display=swap" rel="stylesheet">
    
    <style>
        /* --- GLOBAL & RESET --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* --- 1. WII SAFETY WARNING SCREEN (Top Layer) --- */
        #safety-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: opacity 0.8s ease-out;
            user-select: none;
        }

        #safety-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .safety-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .warning-icon {
            background-color: #d1d1d1;
            color: #000;
            width: 50px;
            height: 44px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-weight: bold;
            font-size: 30px;
            padding-bottom: 2px;
        }

        .warning-icon span {
            margin-bottom: -2px;
        }

        .safety-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d1d1d1;
        }

        .safety-text {
            text-align: center;
            max-width: 700px;
            font-size: 20px;
            line-height: 1.6;
            color: #b0b0b0;
            margin-bottom: 80px;
            font-weight: bold;
        }

        .press-a-container {
            font-size: 22px;
            color: #d1d1d1;
            font-weight: bold;
            animation: pulseText 2s infinite;
        }

        .a-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: #d1d1d1;
            color: #000;
            border-radius: 50%;
            margin: 0 5px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        @keyframes pulseText {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* --- 2. WII MENU LOADING SCREEN (Bottom Layer) --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Container for the Grid */
        .wii-grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            padding: 20px;
        }

        /* The Individual Channel Slot */
        .channel-slot {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 2px solid #333;
            border-radius: 30px / 50%; /* Iconic TV shape */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* The Text inside the channel - UPDATED to Qbbic */
        .channel-slot::after {
            content: 'Qbbic'; 
            font-family: sans-serif;
            font-weight: bold;
            font-size: 22px; /* Slightly adjusted size */
            color: #444;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        /* Animation: Staggered Fade Wave */
        .channel-slot {
            animation: fade-wave 1.5s infinite ease-in-out;
        }

        /* Stagger animations for a wave effect */
        .channel-slot:nth-child(1) { animation-delay: 0.0s; }
        .channel-slot:nth-child(2) { animation-delay: 0.1s; }
        .channel-slot:nth-child(3) { animation-delay: 0.2s; }
        .channel-slot:nth-child(4) { animation-delay: 0.3s; }
        .channel-slot:nth-child(5) { animation-delay: 0.1s; }
        .channel-slot:nth-child(6) { animation-delay: 0.2s; }
        .channel-slot:nth-child(7) { animation-delay: 0.3s; }
        .channel-slot:nth-child(8) { animation-delay: 0.4s; }
        .channel-slot:nth-child(9) { animation-delay: 0.2s; }
        .channel-slot:nth-child(10) { animation-delay: 0.3s; }
        .channel-slot:nth-child(11) { animation-delay: 0.4s; }
        .channel-slot:nth-child(12) { animation-delay: 0.5s; }

        @keyframes fade-wave {
            0%, 100% { 
                background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
                border-color: #333;
            }
            50% { 
                background: linear-gradient(135deg, #3d3d3d, #2a2a2a);
                border-color: #555;
            }
        }

        /* Bottom Bar */
        .wii-bottom-bar {
            margin-top: 30px;
            color: #555;
            font-family: sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <audio id="select-sound" src="/assets/Options.wav" preload="auto"></audio>

    <div id="safety-screen">
        <div class="safety-header">
            <div class="warning-icon"><span>!</span></div>
            <div class="safety-title">WARNING-WORK AND SCHOOL SAFETY</div>
        </div>
        <div class="safety-text">
            <p style="margin-bottom: 30px;">BEFORE PLAYING, PLEASE ENSURE YOU HAVE COMPLETED<br>ALL OF YOUR ASSIGNED CLASSWORK AND JOB RESPONSIBILITIES.</p>
            <p>IF YOU GET CAUGHT SLACKING OFF, IT IS NOT<br>THE FAULT OF TEAM QBBIC.</p>
        </div>
        <div class="press-a-container">
            Press <span class="a-button">A</span> to continue.
        </div>
    </div>

    <div id="loading-screen">
        <div class="wii-grid-container">
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
            <div class="channel-slot"></div>
        </div>
        <div class="wii-bottom-bar">Loading System...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const safetyScreen = document.getElementById('safety-screen');
            const selectSound = document.getElementById('select-sound');
            
            function enterSite() {
                // Prevent double clicking
                if(safetyScreen.getAttribute('data-clicked') === 'true') return;
                safetyScreen.setAttribute('data-clicked', 'true');
                
                // 1. Play Sound
                if(selectSound) {
                    selectSound.currentTime = 0;
                    selectSound.play().catch(e => console.log('Audio autoplay blocked'));
                }
                
                // 2. Fade out Safety Screen
                safetyScreen.classList.add('fade-out');

                // 3. Wait 3 seconds, then redirect
                setTimeout(() => {
                    window.location.href = 'games.html';
                }, 3000);
            }

            // Listen for clicks on the safety screen
            safetyScreen.addEventListener('click', enterSite);
            
            // Listen for keydown
            document.addEventListener('keydown', (e) => {
                if (document.body.contains(safetyScreen) && e.key.toLowerCase() === 'a') {
                    enterSite();
                }
            });
        });
    </script>
</body>
</html>
