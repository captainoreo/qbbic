<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danganronpa - PSP EmulatorJS</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ff3366; /* Danganronpa pink */
        }
        /* Container for the emulator to maintain aspect ratio */
        #emulator-container {
            width: 800px;
            height: 450px;
            max-width: 100%;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }
    </style>
</head>
<body>

    <h1>Danganronpa: Trigger Happy Havoc</h1>
    <p>Loading game directly from CDN...</p>

    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script>
        // Set the ID of the div to load the emulator into
        EJS_player = '#game';
        
        // Set the core to PSP (PlayStation Portable)
        EJS_core = 'psp';
        
        // Display name for the emulator UI
        EJS_gameName = 'Danganronpa';
        
        // UI color theme
        EJS_color = '#ff3366'; 
        
        // Path to the EmulatorJS core data (Using provided custom CDN)
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/';
        
        // Path to the game file (Using provided custom CDN)
        EJS_gameUrl = 'https://cdn.jsdelivr.net/gh/captainoreo/qbbic@main/games/Dangan-Ronpa%20-%20Kibou%20no%20Gakuen%20to%20Zetsubou%20no%20Koukousei%20(Japan)%20(v1.03).zip'; 
        
        // Optional: Auto-start the game once the ROM is loaded
        EJS_startOnLoaded = false; 
    </script>

    <script src="https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js"></script>

</body>
</html>
