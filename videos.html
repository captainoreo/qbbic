<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii Homebrew Player</title>
    <style>
        /* --- 1. THE WII AESTHETIC BACKGROUND --- */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #001f4d 0%, #0060aa 50%, #001f4d 100%);
            background-size: 400% 400%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; /* Close to Wii font */
            overflow: hidden;
            animation: gradientShift 15s ease infinite;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1"><path d="M5.5 2l6 14 3.5-4 4.5 5.5-2.5 2.5-4.5-5.5-2.5 3z"/></svg>'), auto;
        }

        /* Animated background stripes */
        .stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                rgba(255, 255, 255, 0.03) 40px,
                rgba(255, 255, 255, 0.03) 80px
            );
            z-index: 0;
            pointer-events: none;
        }

        /* Floating Bubbles Container */
        .bubbles-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
            border-radius: 50%;
            bottom: -50px;
            animation: floatUp linear infinite;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* --- 2. THE VIDEO PLAYER CONTAINER --- */
        .player-container {
            position: relative;
            width: 800px;
            max-width: 90%;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 20px;
            box-shadow: 
                0 0 0 4px rgba(255, 255, 255, 0.3),
                0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow: hidden;
            group: hover .controls { opacity: 1; }
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* --- 3. THE YOUTUBE-STYLE UI OVERLAY --- */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-container:hover .controls-overlay {
            opacity: 1;
        }

        /* The Progress Bar (Wii style) */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .progress-filled {
            height: 100%;
            width: 0%;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            box-shadow: 0 0 10px #00f2fe;
            transition: width 0.1s linear;
        }

        /* The Control Buttons Row */
        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Glossy Buttons */
        button {
            background: none;
            border: none;
            cursor: pointer;
            color: white;
            padding: 8px;
            border-radius: 50%;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The distinctive "Wii Hover" effect */
        button:hover {
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
            transform: scale(1.1);
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: white;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        .time-display {
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stripes"></div>
    <div class="bubbles-container" id="bubbles"></div>

    <div class="player-container" id="playerContainer">
        <video id="video" src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>

        <div class="controls-overlay">
            <div class="progress-container" id="progressContainer">
                <div class="progress-filled" id="progressBar"></div>
            </div>

            <div class="buttons-row">
                <div class="left-controls">
                    <button id="playBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    
                    <button id="muteBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>

                    <div class="time-display">
                        <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="right-controls">
                    <button>
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    </button>

                    <button id="fsBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. BUBBLE GENERATOR (Wii Style) ---
        const bubbleContainer = document.getElementById('bubbles');
        
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            // Randomize size
            const size = Math.random() * 60 + 20; // 20px to 80px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            // Randomize position
            bubble.style.left = `${Math.random() * 100}%`;
            
            // Randomize speed
            bubble.style.animationDuration = `${Math.random() * 10 + 5}s`;
            
            bubbleContainer.appendChild(bubble);
            
            // Remove after animation
            setTimeout(() => {
                bubble.remove();
            }, 15000);
        }

        // Create bubbles periodically
        setInterval(createBubble, 1000);

        // --- 2. VIDEO PLAYER LOGIC ---
        const video = document.getElementById('video');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const fsBtn = document.getElementById('fsBtn');
        const playerContainer = document.getElementById('playerContainer');

        // Play/Pause Toggle
        function togglePlay() {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
            } else {
                video.pause();
                playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            }
        }

        playBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        // Time Formatting
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Update Progress Bar & Time
        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(video.currentTime);
            if(!isNaN(video.duration)) {
                durationEl.textContent = formatTime(video.duration);
            }
        });

        // Click on Progress Bar
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = video.duration;
            video.currentTime = (clickX / width) * duration;
        });

        // Fullscreen
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

    </script>
</body>
</html>
