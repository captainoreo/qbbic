<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolf's Watch: Evening Stars</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fffaf0; font-family: 'Segoe UI', sans-serif; }
        #ui-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 600px; background: rgba(255, 255, 255, 0.95);
            padding: 20px; border-radius: 20px; border: 2px solid #ffccd5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 10;
        }
        #text-display { color: #d63384; font-size: 18px; margin-bottom: 15px; min-height: 50px; }
        .btn-group { display: flex; gap: 10px; }
        .choice-btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            background: #ff85a1; color: white; cursor: pointer; font-weight: bold;
        }
        .choice-btn:hover { background: #ff5c8d; }
    </style>
</head>
<body>

    <div id="ui-box">
        <div id="text-display">"Oh! You're still here? I was hoping I'd catch you before you finished your shift..."</div>
        <div class="btn-group">
            <button class="choice-btn" onclick="next('stay')">"I'm glad you did."</button>
            <button class="choice-btn" onclick="next('busy')">"Just finishing up!"</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff0f5);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(2, 4, 5);
        scene.add(dirLight);

        // --- STYLIZED BODY CONSTRUCTION ---
        const wolf = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.7 });

        // 1. Torso (Hourglass/Stylized)
        // Upper Chest
        const chest = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), mat);
        chest.scale.set(1, 0.8, 0.8);
        chest.position.y = 1.35;
        wolf.add(chest);

        // Waist/Hips
        const hips = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), mat);
        hips.scale.set(1, 0.9, 0.8);
        hips.position.y = 0.85;
        wolf.add(hips);

        // 2. Limbs (Long & Tapered)
        const limbMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d });
        
        // Legs
        const createLeg = (x) => {
            const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 1.0, 4, 8), limbMat);
            leg.position.set(x, 0.35, 0);
            return leg;
        };
        wolf.add(createLeg(-0.16), createLeg(0.16));

        // Arms
        const createArm = (x, rot) => {
            const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.7, 4, 8), limbMat);
            arm.position.set(x, 1.25, 0);
            arm.rotation.z = rot;
            return arm;
        };
        const armL = createArm(-0.38, 0.1);
        const armR = createArm(0.38, -0.1);
        wolf.add(armL, armR);

        // 3. Head & Ears
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.32), mat);
        head.position.y = 1.95;
        wolf.add(head);

        const earGeo = new THREE.ConeGeometry(0.14, 0.5, 3);
        const earL = new THREE.Mesh(earGeo, mat);
        earL.position.set(-0.2, 2.35, 0);
        earL.rotation.z = 0.3;
        const earR = earL.clone();
        earR.position.x = 0.2;
        earR.rotation.z = -0.3;
        wolf.add(earL, earR);

        // Eyes
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04), new THREE.MeshBasicMaterial({ color: 0xff69b4 }));
        eye.position.set(-0.12, 1.98, 0.3);
        const eyeR = eye.clone(); eyeR.position.x = 0.12;
        wolf.add(eye, eyeR);

        scene.add(wolf);

        // --- ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            // Gentle breathing/idle pose
            wolf.position.y = Math.sin(time) * 0.03;
            armL.rotation.x = Math.sin(time * 0.5) * 0.1;
            armR.rotation.x = Math.cos(time * 0.5) * 0.1;
            
            renderer.render(scene, camera);
        }
        animate();

        window.next = (choice) => {
            const display = document.getElementById('text-display');
            if(choice === 'stay') display.innerText = "She smiles softly. 'I'm glad too. It's much better than being out there in the dark alone...'";
            else display.innerText = "She nods understandingly. 'Work comes first, I know. But don't push yourself too hard, okay?'";
        };
    </script>
</body>
</html>
