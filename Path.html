<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>path.html</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; cursor: crosshair; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            color: #444; font-family: 'Courier New', monospace;
            z-index: 99; transition: opacity 0.5s;
        }
        #noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0.08;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAABMTExERERmZmYzMzMyMjJ4D3W4AAAACHRSTlMAMwAyzMzMzO0Uk5UAAAAJcEhZcwAAFxEAABcRAcom8z8AAABMSURBVDjLY2AYBaNgKLHgAAg7BwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgwUA4AAMu3Mx20+okAAAAASUVORK5CYII=');
        }
        #blink {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; opacity: 0; pointer-events: none;
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay"><h1>CLICK TO WAKE UP</h1></div>
    <div id="noise"></div>
    <div id="blink"></div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- AUDIO ENGINE (Procedural Horror Sounds) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let droneOsc;
        let gainNode;

        function startAudio() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Low Drone
            droneOsc = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            droneOsc.type = 'sawtooth';
            droneOsc.frequency.setValueAtTime(50, audioCtx.currentTime);
            
            // Low pass filter to make it muffled
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 120;

            gainNode.gain.value = 0.1;

            droneOsc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            droneOsc.start();
        }

        function screamSound() {
            const osc = audioCtx.createOscillator();
            const gn = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            
            // Random modulation
            osc.frequency.linearRampToValueAtTime(Math.random() * 2000, audioCtx.currentTime + 0.5);

            gn.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gn.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            osc.connect(gn);
            gn.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // --- 3D SCENE SETUP ---
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        let flashLight;
        let shakeIntensity = 0;
        let isScared = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.05); // Denser fog

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.7;

            // Flashlight
            flashLight = new THREE.SpotLight(0xffffff, 50, 25, Math.PI/7, 0.5, 1);
            flashLight.position.set(0, 0, 0);
            flashLight.target.position.set(0, 0, -1);
            camera.add(flashLight);
            camera.add(flashLight.target);
            scene.add(camera);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(6, 2000);
            floorGeo.rotateX(-Math.PI / 2);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111, roughness: 1.0 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.z = -900;
            scene.add(floor);

            // Ceiling (makes it claustrophobic)
            const ceiling = floor.clone();
            ceiling.position.y = 4;
            ceiling.rotation.x = Math.PI / 2; 
            scene.add(ceiling);

            // Walls (Pillars)
            const pillarGeo = new THREE.BoxGeometry(0.5, 4, 0.5);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
            
            for(let i = 0; i < 150; i++) {
                let zPos = -i * 8;
                const pLeft = new THREE.Mesh(pillarGeo, pillarMat);
                pLeft.position.set(-3.2, 2, zPos);
                scene.add(pLeft);

                const pRight = new THREE.Mesh(pillarGeo, pillarMat);
                pRight.position.set(3.2, 2, zPos);
                scene.add(pRight);
            }

            // The Entity (The "Watcher")
            const watcherGeo = new THREE.BoxGeometry(0.6, 2.5, 0.6);
            const watcherMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const watcher = new THREE.Mesh(watcherGeo, watcherMat);
            
            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.05);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.15, 0.8, 0.31);
            eyeR.position.set(0.15, 0.8, 0.31);
            watcher.add(eyeL); 
            watcher.add(eyeR);
            
            watcher.name = "entity";
            watcher.position.set(0, 1.25, 5); // Starts behind
            scene.add(watcher);


            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false }); // False makes it grittier
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new PointerLockControls(camera, document.body);
            
            const overlay = document.getElementById('overlay');
            overlay.addEventListener('click', () => {
                controls.lock();
                startAudio();
                overlay.style.opacity = 0;
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }
        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 35.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 35.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // --- HORROR MECHANICS ---

                // 1. Blinking
                const blinkDiv = document.getElementById('blink');
                if(Math.random() > 0.995) {
                    blinkDiv.style.opacity = 1;
                    setTimeout(() => blinkDiv.style.opacity = 0, 100);
                }

                // 2. Flashlight Flicker
                flashLight.intensity = 50 + Math.sin(time * 0.05) * 20 + (Math.random() * 10);
                
                // 3. Check "Looking Back"
                const lookDir = new THREE.Vector3();
                camera.getWorldDirection(lookDir);
                const entity = scene.getObjectByName('entity');

                if (lookDir.z > 0.3) { // Looking backwards
                    if (!isScared) {
                        isScared = true;
                        screamSound();
                    }
                    
                    shakeIntensity = 0.1; // VIOLENT SHAKE
                    scene.fog.color.setHex(0x550000); // RED FOG
                    
                    // Teleport entity closer
                    entity.position.set(
                        camera.position.x, 
                        1.25, 
                        camera.position.z + 3
                    );
                    entity.lookAt(camera.position);

                } else {
                    // Looking Forward (Safety)
                    isScared = false;
                    shakeIntensity = THREE.MathUtils.lerp(shakeIntensity, 0, 0.1);
                    scene.fog.color.setHex(0x000000);
                    
                    // Entity follows slowly behind
                    if(entity.position.z < camera.position.z + 5) {
                        entity.position.z = camera.position.z + 10; 
                    }
                }

                // 4. Camera Shake Application
                if(shakeIntensity > 0.001) {
                    camera.rotation.z = (Math.random() - 0.5) * shakeIntensity;
                    camera.rotation.x += (Math.random() - 0.5) * shakeIntensity;
                } else {
                    camera.rotation.z = 0;
                }

                // 5. Breathing / Bobbing
                if(moveForward || moveBackward) {
                    camera.position.y = 1.7 + Math.sin(time * 0.01) * 0.05;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
