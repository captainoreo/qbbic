<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>path.html</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #instructions {
            position: absolute;
            top: 50%; width: 100%; text-align: center;
            color: #ffffff;
            pointer-events: none;
            font-size: 20px;
            text-shadow: 0 0 5px #ff0000;
            transition: opacity 1s;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px #000000;
            pointer-events: none;
            mix-blend-mode: multiply;
        }
        #noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05; pointer-events: none;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAABMTExERERmZmYzMzMyMjJ4D3W4AAAACHRSTlMAMwAyzMzMzO0Uk5UAAAAJcEhZcwAAFxEAABcRAcom8z8AAABMSURBVDjLY2AYBaNgKLHgAAg7BwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgpBwgwUA4AAMu3Mx20+okAAAAASUVORK5CYII=');
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="vignette"></div>
    <div id="noise"></div>
    <div id="instructions">
        CLICK TO ENTER THE PATH<br>
        <span style="font-size:14px; color:#888;">(W,A,S,D to Walk)</span>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let raycaster;

        // Game State
        const objects = [];
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Horror Elements
        let flashLight;
        let ambientLight;
        let walkDistance = 0;
        let spookyEventTriggered = false;
        let heartBeatTime = 0;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            // Thick black fog for limited visibility
            scene.fog = new THREE.FogExp2(0x000000, 0.035);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6; // Eye level

            // 3. Audio Listener (Ready for sound expansion)
            const listener = new THREE.AudioListener();
            camera.add(listener);

            // 4. Lighting (The Flashlight)
            ambientLight = new THREE.AmbientLight(0xffffff, 0.02); // Very dark
            scene.add(ambientLight);

            flashLight = new THREE.SpotLight(0xffffee, 20, 40, Math.PI/6, 0.5, 2);
            flashLight.position.set(0, 0, 0);
            flashLight.target.position.set(0, 0, -1);
            
            // Attach flashlight to camera so it moves with view
            camera.add(flashLight);
            camera.add(flashLight.target);
            scene.add(camera);

            // 5. The Path (Floor)
            const floorGeometry = new THREE.PlaneGeometry(4, 2000);
            floorGeometry.rotateX(-Math.PI / 2);
            // Rough texture using noise via vertex colors could be here, but using basic material for code simplicity
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333, 
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.position.z = -900; // Extend far into the dark
            scene.add(floor);

            // Add walls (invisible barriers or visible pillars)
            const pillarGeo = new THREE.BoxGeometry(0.5, 10, 0.5);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            for(let i = 0; i < 100; i++) {
                const pillarL = new THREE.Mesh(pillarGeo, pillarMat);
                pillarL.position.set(-3, 5, -i * 10);
                scene.add(pillarL);

                const pillarR = new THREE.Mesh(pillarGeo, pillarMat);
                pillarR.position.set(3, 5, -i * 10);
                scene.add(pillarR);
            }

            // 6. Controls
            controls = new PointerLockControls(camera, document.body);

            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                instructions.style.display = 'block';
                instructions.innerHTML = "PAUSED";
            });

            scene.add(controls.getObject());

            // Key Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // 7. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 8. The "Entity" (A surprise element)
        const entityGeo = new THREE.IcosahedronGeometry(1, 0);
        const entityMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
        const entity = new THREE.Mesh(entityGeo, entityMat);
        entity.position.set(0, 1.5, 10); // Starts behind you
        scene.add(entity);


        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {

                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // consistent movement in all directions

                if (moveForward || moveBackward) velocity.z -= direction.z * 30.0 * delta; // Speed
                if (moveLeft || moveRight) velocity.x -= direction.x * 30.0 * delta;

                // Move Controls
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Update Walk Distance
                walkDistance = -camera.position.z;

                // --- HORROR LOGIC --- //

                // 1. Flashlight Flickering
                if (Math.random() > 0.95) {
                    flashLight.intensity = (Math.random() * 20) + 10;
                }

                // 2. Head Bobbing (Breathing effect)
                if (moveForward || moveBackward || moveLeft || moveRight) {
                    camera.position.y = 1.6 + Math.sin(time * 0.015) * 0.05;
                }

                // 3. The "Don't Look Back" Mechanic
                // If user walks far enough and turns around...
                const lookDirection = new THREE.Vector3();
                camera.getWorldDirection(lookDirection);

                // Logic: If looking positive Z (backwards) and moved far enough
                if (lookDirection.z > 0.5 && walkDistance > 20) {
                     // Teleport entity closer
                     entity.position.z = camera.position.z + 5;
                     entity.position.x = camera.position.x;
                     entity.rotation.x += 0.1;
                     entity.rotation.y += 0.1;
                     
                     // Make screen redder
                     scene.fog.color.setHex(0x330000);
                     scene.fog.density = 0.1;
                } else {
                     // Reset fog if looking forward
                     scene.fog.color.setHex(0x000000);
                     if(scene.fog.density > 0.035) scene.fog.density -= 0.005;
                     
                     // Keep entity behind
                     if(entity.position.z < camera.position.z + 10) {
                        entity.position.z = camera.position.z + 15;
                     }
                }

                // 4. Boundary Check (Don't fall off the path)
                if (camera.position.x < -2) camera.position.x = -2;
                if (camera.position.x > 2) camera.position.x = 2;

            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
