<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolf's Watch: Final Shift</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #0f0; }
        
        /* Scanline Effect */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 15; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        #ui-top {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,20,0,0.8); padding: 10px; border: 1px solid #0f0;
        }

        #pager-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 320px; background: #111; border: 4px solid #333;
            padding: 10px; z-index: 20;
        }

        #pager-screen {
            background: #051a05; color: #0f0; padding: 10px; height: 200px;
            display: flex; flex-direction: column; border: 2px solid #003300;
        }

        #msg-history { font-size: 13px; flex-grow: 1; overflow-y: hidden; }
        
        .bar-label { font-size: 10px; margin-top: 5px; }
        .bar-bg { width: 100%; height: 100%; background: #002200; border: 1px solid #0f0; height: 10px; }
        #patience-bar, #power-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }

        #reply-btn {
            background: #000; color: #0f0; border: 1px solid #0f0;
            cursor: pointer; padding: 8px; margin-top: 10px; font-weight: bold;
        }

        #jumpscare {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 100; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="ui-top">
        POWER: <span id="power-val">100</span>%<br>
        <div class="bar-bg" style="width: 150px;"><div id="power-bar"></div></div>
        TIME: <span id="clock-val">12:00</span> AM
    </div>

    <div id="pager-container">
        <div id="pager-screen">
            <div id="msg-history"><div>[CONNECTION SECURE]</div></div>
            <div class="bar-label">AFFECTION/PATIENCE</div>
            <div class="bar-bg"><div id="patience-bar"></div></div>
            <button id="reply-btn">REPLY (SPACE)</button>
        </div>
    </div>

    <div id="jumpscare">
        <h1 style="color:red; font-size: 80px; margin: 0;">CONNECTION LOST</h1>
        <p style="color:white;">She didn't like being ignored.</p>
        <button onclick="location.reload()" style="background:none; color:white; border:1px solid white; padding:10px; cursor:pointer;">RETRY</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- ENGINE CONFIG ---
        let power = 100, patience = 100, isDead = false, gameActive = false;
        let lastMsgTime = 0, hour = 0;
        const msgs = ["Don't look at the hall...", "Look at me instead.", "Are you bored of me?", "I'm getting closer...", "Can you hear my heart?"];

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.12);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- OFFICE & HALLWAY ---
        const hallwayGeo = new THREE.BoxGeometry(8, 8, 100);
        const hallwayMat = new THREE.MeshStandardMaterial({ color: 0x111111, side: THREE.BackSide });
        const hallway = new THREE.Mesh(hallwayGeo, hallwayMat);
        hallway.position.z = -45;
        scene.add(hallway);

        const flashlight = new THREE.SpotLight(0xffffff, 40, 30, Math.PI/6, 0.5);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // --- THE ENTITY (Wolf-Like) ---
        const wolf = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.2, 3), new THREE.MeshStandardMaterial({color: 0x000000}));
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color: 0x000000}));
        head.position.y = 1.6;
        
        // Wolf Ears (Geometric)
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, 3), new THREE.MeshStandardMaterial({color: 0x000000}));
        const earL = ear.clone(); earL.position.set(-0.2, 2, 0);
        const earR = ear.clone(); earR.position.set(0.2, 2, 0);
        
        // Glowing Eyes
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xff0000}));
        const eyeL = eye.clone(); eyeL.position.set(-0.15, 1.7, 0.3);
        const eyeR = eye.clone(); eyeR.position.set(0.15, 1.7, 0.3);

        wolf.add(body, head, earL, earR, eyeL, eyeR);
        wolf.position.set(0, -1.5, -25);
        scene.add(wolf);

        // --- INPUTS ---
        let mouseX = 0;
        window.addEventListener('mousemove', (e) => mouseX = (e.clientX / window.innerWidth) * 2 - 1);
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') sendReply(); });
        document.getElementById('reply-btn').addEventListener('click', sendReply);

        function sendReply() {
            if (isDead) return;
            patience = Math.min(100, patience + 12);
            const d = document.createElement('div');
            d.innerHTML = `<span style="color:#8f8">> YOU: I'm here.</span>`;
            document.getElementById('msg-history').appendChild(d);
            document.getElementById('msg-history').scrollTop = 999;
        }

        // --- MAIN LOOP ---
        const clock = new THREE.Clock();
        function update() {
            if (isDead) return;
            requestAnimationFrame(update);

            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            // 1. Manage Power & Time
            power -= dt * 0.8; // Constant drain
            if (Math.abs(mouseX) > 0.5) power -= dt * 1.5; // Drain more when moving camera fast
            
            document.getElementById('power-bar').style.width = power + "%";
            document.getElementById('power-val').innerText = Math.ceil(power);
            document.getElementById('clock-val').innerText = `12:0${Math.floor(time/10)} `; // Speeded up time

            // 2. Manage Patience
            patience -= dt * 5; 
            document.getElementById('patience-bar').style.width = patience + "%";
            if (time - lastMsgTime > 5) {
                lastMsgTime = time;
                const d = document.createElement('div');
                d.innerText = "WOLF: " + msgs[Math.floor(Math.random()*msgs.length)];
                document.getElementById('msg-history').appendChild(d);
            }

            // 3. Camera & Flashlight
            camera.rotation.y += (-mouseX * 1.4 - camera.rotation.y) * 0.05;
            flashlight.position.copy(camera.position);
            flashlight.target.position.set(Math.sin(camera.rotation.y)*-10, 0, Math.cos(camera.rotation.y)*-10);
            
            // Flashlight flickering as power dies
            if (power < 20 && Math.random() > 0.9) flashlight.intensity = 0;
            else flashlight.intensity = 40;

            // 4. Monster Movement
            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
            const mDir = wolf.position.clone().sub(camera.position).normalize();
            const lookingAt = camDir.angleTo(mDir) < 0.6;

            if (!lookingAt) {
                wolf.position.z += dt * 2.5; // Moves when you aren't looking
            }

            // 5. Lose Conditions
            if (power <= 0 || patience <= 0 || wolf.position.z > 2) {
                isDead = true;
                document.getElementById('jumpscare').style.display = 'flex';
                // Trigger visual glitch
                renderer.domElement.style.filter = "invert(1) contrast(2)";
            }

            renderer.render(scene, camera);
        }

        update();
    </script>
</body>
</html>
