    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent-color: #40c4ff;
            --card-hover-shadow: rgba(64, 196, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--text-primary);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* --- Card Grid Layout --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Card Styling --- */
        .html-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .html-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px var(--card-hover-shadow);
        }

        .card-image {
            height: 160px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 1px solid #2a2a2a;
        }

        .card-title {
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Styling for empty placeholder slots */
        .html-card.placeholder {
            opacity: 0.3;
            pointer-events: none;
            border: 2px dashed #444;
            background-color: transparent;
            box-shadow: none;
        }
        .html-card.placeholder .card-image {
            background-color: #222;
            border-bottom: none;
        }
    </style>

            const card = document.createElement('a');

            card.className = game.isPlaceholder ? 'html-card placeholder' : 'html-card';
            card.title = game.title;

            const imageDiv = document.createElement('div');
            imageDiv.className = 'card-image';
            if (game.img) {
                imageDiv.style.backgroundImage = `url('${game.img}')`;
            }

            const titleDiv = document.createElement('div');
            titleDiv.className = 'card-title';
            titleDiv.textContent = game.title;

            card.appendChild(imageDiv);
            card.appendChild(titleDiv);
            grid.appendChild(card);
        });
